{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link href="{% static 'css/task_form.css' %}" rel="stylesheet">
{% endblock %}

{% block title %}Удалить задачу{% endblock %}

{% block content %}
<div class="task-form-wrapper">
    <div class="task-form-card">
        <div class="form-header">
            <h1>&#128465; Удалить задачу</h1>
            <p class="task-form-subtitle">Вы уверены, что хотите удалить задачу "{{ object.title }}"?</p>
            <a href="{% url 'task-list' %}" class="btn-back">&#8617; Отменить</a>
        </div>

        <form method="post" action="" class="task-form">
            {% csrf_token %}

            <div class="form-actions">
                <button type="submit" class="btn-submit btn-danger-submit">Да, удалить</button>
                <a href="{% url 'task-list' %}" class="btn-cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
